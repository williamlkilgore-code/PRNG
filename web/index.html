<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice Delve</title>
  <meta name="description" content="A procedurally generated roll-and-write dungeon crawler. Roll two dice, slide through the dungeon, find the stairs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23fffdf6' stroke='%232b2a33' stroke-width='2'/%3E%3Ccircle cx='10' cy='10' r='2.6' fill='%232b2a33'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23c8372d'/%3E%3Ccircle cx='22' cy='22' r='2.6' fill='%232b2a33'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#fffaf0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dice Delve">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sprites" aria-hidden="true"></div>

  <header class="hud">
    <h1 class="brand">Dice Delve</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="menu">
      <button class="ghost-btn" id="journalBtn" type="button" title="Journal" aria-label="Journal">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2.5h10a2 2 0 0 1 2 2v13H6a2 2 0 0 1-2-2Z M4 15.5a2 2 0 0 1 2-2h10 M7.5 6.5h5 M7.5 9.5h5" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/></svg>
        <span class="label">Journal</span><span class="unread" id="journalCount" hidden></span>
      </button>
      <button class="ghost-btn menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="menuItems" aria-label="Menu">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"/></svg>
      </button>
      <div class="menu-items" id="menuItems">
        <button class="ghost-btn" id="helpBtn" type="button" title="How to play">Rules</button>
        <button class="ghost-btn" id="menuBtn" type="button" title="New game">New</button>
        <button class="ghost-btn" id="savesBtn" type="button" title="Save, load, export or import games">Saves</button>
        <button class="ghost-btn" id="soundBtn" type="button" title="Settings: sound, animations, theme, text size (M to mute)" aria-label="Settings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.6 1.8h2.8l.5 2.3 1.6.9 2.2-.8 1.4 2.4-1.8 1.6v1.6l1.8 1.6-1.4 2.4-2.2-.8-1.6.9-.5 2.3H8.6l-.5-2.3-1.6-.9-2.2.8-1.4-2.4 1.8-1.6V8.2L2.9 6.6l1.4-2.4 2.2.8 1.6-.9Z" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round"/><circle cx="10" cy="9.8" r="2.6" style="fill:none;stroke:currentColor;stroke-width:1.6"/><path class="slash" d="M3 3l14 14" style="fill:none;stroke-width:2;stroke-linecap:round"/></svg><span class="label">Settings</span></button>
        <button class="ghost-btn" id="themeBtn" type="button" title="Theme: parchment, dungeon or high contrast" aria-label="Change theme"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" style="fill:none;stroke:currentColor" stroke-width="2"/><path d="M10 2a8 8 0 0 1 0 16Z" style="fill:currentColor"/></svg><span class="label">Theme</span></button>
        <button class="ghost-btn" id="fullBtn" type="button" title="Fullscreen" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" style="fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"/></svg><span class="label">Fullscreen</span></button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap" aria-label="Dungeon map">
      <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dungeon map"></svg>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      <div class="scene" id="scene" hidden title="Tap to skip"></div>
      <div class="curtain" id="curtain" hidden></div>
    </section>

    <aside class="controls" aria-label="Controls">
      <div class="dice-box">
        <div class="dice" id="dice"></div>
        <div class="dice-info" id="diceInfo"></div>
        <button class="sling-btn" id="slingBtn" type="button" title="Sling: shoot instead of moving" aria-label="Sling">
          <svg viewBox="0 0 32 32" class="icon" aria-hidden="true"><use href="#i-sling"/></svg><span class="count">0</span>
        </button>
      </div>
      <p class="status" id="status"></p>
      <div class="stop-row" id="stopRow" hidden>
        <button class="btn primary" type="button" id="stopBtn">Stop here</button>
        <button class="btn" type="button" id="keepBtn">Keep going</button>
      </div>
      <div class="pad" id="pad" aria-label="Direction pad"></div>
      <div class="spells" id="spells" aria-label="Spells"></div>
    </aside>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBody"></div>
  </div>

  <script src="js/rng.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/levelgen.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
